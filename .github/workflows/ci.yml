# Integração contínua — corre em cada PR para main e em cada push para main.
# Os jobs `verify` e `audit` são checks obrigatórios na protecção do branch main.
name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Consistência i18n
        run: npm run check:i18n

      - name: Alinhamento da ontologia
        run: npm run check:ontology

      - name: Build de produção
        run: npm run build

      - name: Smoke test
        run: npm run smoke

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm audit (high/critical)
        # Informativo até ao merge da PR de correcção das vulnerabilidades existentes.
        continue-on-error: true
        run: npm audit --audit-level=high
