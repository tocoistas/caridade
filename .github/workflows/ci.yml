# Integração contínua — corre em cada PR para main e em cada push para main.
# Os jobs `verify`, `audit`, `rules` e `e2e` são checks obrigatórios na protecção do branch main.
name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Consistência i18n
        run: npm run check:i18n

      - name: Alinhamento da ontologia
        run: npm run check:ontology

      - name: Build de produção
        run: npm run build

      - name: Smoke test
        run: npm run smoke

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências e ferramentas de teste
        run: |
          npm ci --no-audit --no-fund
          npm install -g firebase-tools@14

      - name: Testes das regras Firestore (emulador)
        run: npm run test:rules

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências e firebase-tools
        run: |
          npm ci --no-audit --no-fund
          npm install -g firebase-tools@14

      - name: Build de produção
        run: npm run build

      - name: Testes end-to-end da API (servidor + emulador Firestore)
        run: npm run test:e2e
