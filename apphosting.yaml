# Configuração do backend do Firebase App Hosting (Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Variáveis de ambiente.
#
# O servidor acede ao Firestore com o Admin SDK e as credenciais da service account
# do backend (Application Default Credentials) — não há chaves nem configuração do
# SDK cliente do Firebase (a web já não usa Firebase Auth nem Firestore no browser).
# Segredos futuros devem usar Secret Manager (`secret:`), nunca valores em claro.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
env:
  - variable: NEXT_PUBLIC_BASE_URL
    value: https://caridade.ao
    availability:
      - BUILD
      - RUNTIME
