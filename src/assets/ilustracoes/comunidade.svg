<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="fundoDisco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="100%" stop-color="#EAE2CF"/>
    </linearGradient>
    <clipPath id="disco"><circle cx="260" cy="200" r="180"/></clipPath>
  </defs>

  <circle cx="260" cy="200" r="180" fill="url(#fundoDisco)"/>

  <g clip-path="url(#disco)">
    <!-- Chão -->
    <rect x="20" y="318" width="480" height="80" fill="#EAE2CF"/>
    <path d="M20 318h480" stroke="#3D5A80" stroke-opacity="0.25" stroke-width="3"/>

    <!-- Arcos de alcance -->
    <g fill="none" stroke="#E07A5F" stroke-opacity="0.16" stroke-width="9" stroke-linecap="round">
      <path d="M110 300a150 142 0 0 1 300 0"/>
      <path d="M150 302a110 104 0 0 1 220 0"/>
    </g>

    <!-- Arco de amparo -->
    <path d="M70 300a200 190 0 0 1 380 0" fill="none" stroke="#3D5A80" stroke-width="13" stroke-linecap="round"/>

    <!-- Pessoas -->
    <g>
      <circle cx="156" cy="246" r="24" fill="#3D5A80"/>
      <path d="M112 318a44 48 0 0 1 88 0z" fill="#3D5A80"/>

      <circle cx="364" cy="246" r="24" fill="#2F8A85"/>
      <path d="M320 318a44 48 0 0 1 88 0z" fill="#2F8A85"/>

      <circle cx="260" cy="224" r="32" fill="#E07A5F"/>
      <path d="M200 318a60 62 0 0 1 120 0z" fill="#E07A5F"/>
    </g>
  </g>

  <!-- Coração no topo do arco -->
  <path d="M260 66c-7-11-25-10-31 2-6 12 0 23 8 31l23 22 23-22c8-8 14-19 8-31-6-12-24-13-31-2z" fill="#E07A5F"/>

  <!-- Aro do disco -->
  <circle cx="260" cy="200" r="180" fill="none" stroke="#E07A5F" stroke-opacity="0.3" stroke-width="3"/>

  <!-- Pontos de luz -->
  <circle cx="446" cy="96" r="8" fill="#E07A5F" fill-opacity="0.45"/>
  <circle cx="74" cy="126" r="6" fill="#3D5A80" fill-opacity="0.4"/>
  <circle cx="462" cy="288" r="5" fill="#2F8A85" fill-opacity="0.55"/>
</svg>
